{{ define "main" }}
<div class="main-container" style="max-width: 900px; margin: 0 auto; padding-top: 40px;">

    <h1 class="cv-main-title">{{ .Title }}</h1>
    
    {{ if .Params.description }}
    <p class="cv-description">
        {{ .Params.description }}
    </p>
    {{ end }}

    <div class="cv-content">
        {{ .Content }}
    </div>

</div>
{{ end }}
