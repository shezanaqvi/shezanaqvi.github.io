{{ define "main" }}
<div class="main-container" style="max-width: 900px; margin: 0 auto; padding-top: 40px; padding-left: 20px; padding-right: 20px; padding-bottom: 80px;">

    <h1 style="
        color: #ffffff; 
        font-size: 2.8rem; 
        font-weight: 800; 
        margin-bottom: 10px;
    ">
        Blogs
    </h1>
    
    <p style="
        color: #8b949e; 
        font-size: 1.2rem; 
        margin-bottom: 50px;
    ">
        Thoughts, tutorials, and updates on my research and projects.
    </p>

    <div style="display: flex; flex-direction: column; gap: 25px;">
        {{ range (where .Site.RegularPages "Section" "post") }}
        <a href="{{ .RelPermalink }}" style="text-decoration: none; display: block;">
            <div class="blog-list-card">
                
                <div class="blog-card-header">
                    <h3 class="blog-card-title">{{ .Title }}</h3>
                    <span class="blog-card-date">{{ .Date.Format "Jan 02, 2006" }}</span>
                </div>
                
                <p class="blog-card-summary">
                    {{ .Summary | plainify | truncate 160 }}
                </p>
                
            </div>
        </a>
        {{ end }}
    </div>

</div>

<style>
    /* Styling the cards to match your sleek flat aesthetic */
    .blog-list-card {
        background: transparent;
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 30px;
        transition: all 0.2s ease;
    }

    .blog-card-header {
        display: flex; 
        justify-content: space-between; 
        align-items: baseline; 
        margin-bottom: 15px;
        border-bottom: 1px solid rgba(162, 182, 217, 0.1);
        padding-bottom: 15px;
    }

    .blog-card-title {
        margin: 0; 
        font-size: 1.5rem; 
        font-weight: 700; 
        color: #ffffff;
        transition: color 0.2s ease;
    }

    .blog-card-date {
        font-size: 0.95rem; 
        color: #8b949e; 
        font-weight: 500;
        white-space: nowrap;
        margin-left: 20px;
    }

    .blog-card-summary {
        margin: 0; 
        color: #8b949e; 
        font-size: 1.1rem; 
        line-height: 1.7; 
        font-weight: 400;
    }

    /* Hover Effects */
    .blog-list-card:hover {
        transform: translateY(-3px);
        border-color: #58a6ff;
        background: rgba(88, 166, 255, 0.03);
    }
    
    .blog-list-card:hover .blog-card-title {
        color: #58a6ff; /* Title turns crisp blue on hover */
    }

    /* Mobile adjustments */
    @media (max-width: 768px) {
        .blog-card-header {
            flex-direction: column;
            gap: 10px;
        }
        .blog-card-date {
            margin-left: 0;
        }
    }
</style>
{{ end }}
