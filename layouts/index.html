{{ define "main" }}

    {{ partial "hero.html" . }}
    {{ partial "nerd-stuff.html" . }}

    <div style="max-width: 900px; margin: 0 auto; padding-top: 40px; padding-left: 20px; padding-right: 20px; padding-bottom: 60px;">
        
        <h2 style="
            color: #A2B6D9; /* Slate Blue */
            font-size: 1.5rem; 
            margin-bottom: 30px; 
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(162, 182, 217, 0.2); 
            padding-bottom: 15px;
        ">
            Recent News
        </h2>

        <div style="display: flex; flex-direction: column; gap: 20px;">
            {{ range first 3 (where .Site.RegularPages "Section" "post") }}
            <a href="{{ .RelPermalink }}" style="text-decoration: none;">
                <div class="news-card">
                    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px;">
                        
                        <h3 style="margin: 0; font-size: 1.3rem; font-weight: 700; color: #ffffff;">{{ .Title }}</h3>
                        
                        <span style="font-size: 0.95rem; color: #8b949e; font-weight: 500;">{{ .Date.Format "Jan 02, 2006" }}</span>
                    </div>
                    
                    <p style="margin: 0; color: #8b949e; font-size: 1.05rem; line-height: 1.7; font-weight: 400;">
                        {{ .Summary | plainify | truncate 140 }}
                    </p>
                </div>
            </a>
            {{ end }}
        </div>

        <div style="margin-top: 40px; text-align: center;">
            <a href="/archives" style="
                color: #58a6ff; 
                text-decoration: none; 
                font-weight: 600; 
                font-size: 1.05rem; 
                border-bottom: 1px solid rgba(88, 166, 255, 0.3); 
                transition: all 0.2s;
            " 
               onmouseover="this.style.color='#fff'; this.style.borderColor='#fff';" 
               onmouseout="this.style.color='#58a6ff'; this.style.borderColor='rgba(88, 166, 255, 0.3)';">
                View All Blogs →
            </a>
        </div>

    </div>

    <style>
        .news-card {
            background: transparent; /* Flat layout to match CV */
            border: 1px solid #30363d; /* Subtle dark grey border */
            border-radius: 12px;
            padding: 25px;
            transition: all 0.2s ease;
        }
        .news-card:hover {
            transform: translateY(-3px);
            border-color: #58a6ff; /* Crisp blue hover effect */
            background: rgba(88, 166, 255, 0.03); /* Extremely subtle blue tint on hover */
        }
    </style>

{{ end }}
