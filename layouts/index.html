    {{ partial "hero.html" . }}
    {{ partial "nerd-stuff.html" . }}

    <!-- Project Hail Mary: Petrova Line & Astrophage Background -->
<div class="deep-space-container">
    <div class="petrova-line"></div>
    <div class="astrophage layer-1"></div>
    <div class="astrophage layer-2"></div>
    <div class="astrophage layer-3"></div>
</div>

<style>
    /* 1. Base Container Setup */
    .deep-space-container {
        position: fixed;
        top: 0; 
        left: 0; 
        width: 100vw; 
        height: 100vh;
        z-index: -1;
        background-color: #090329; /* Deep Tau Ceti / Sol Space */
        overflow: hidden;
        pointer-events: none;
    }

    /* 2. The Petrova Line (Glowing IR Band) */
    .petrova-line {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(
            45deg, 
            rgba(9, 3, 41, 0) 40%, 
            rgba(255, 136, 0, 0.08) 48%, 
            rgba(255, 68, 0, 0.15) 50%, 
            rgba(255, 136, 0, 0.08) 52%, 
            rgba(9, 3, 41, 0) 60%
        );
        filter: blur(8px);
        transform: rotate(-15deg);
        animation: pulse-glow 8s ease-in-out infinite alternate;
    }

    /* 3. Astrophage Particles (Parallax Layers) */
    .astrophage {
        position: absolute;
        top: 0; 
        left: 0; 
        width: 100%; 
        height: 200%;
        background-repeat: repeat;
    }

    /* Close up, fast-moving, bright IR specs */
    .layer-1 {
        background-image: radial-gradient(2px 2px at 40px 70px, #ff8800, transparent),
                          radial-gradient(2px 2px at 150px 150px, #ff4400, transparent),
                          radial-gradient(3px 3px at 250px 20px, #ffaa00, transparent);
        background-size: 300px 300px;
        animation: drift-up 40s linear infinite;
        opacity: 0.6;
    }

    /* Mid-distance, medium speed */
    .layer-2 {
        background-image: radial-gradient(1.5px 1.5px at 20px 30px, #ff6600, transparent),
                          radial-gradient(1.5px 1.5px at 180px 90px, #ffaa00, transparent),
                          radial-gradient(1.5px 1.5px at 90px 220px, #ff5500, transparent);
        background-size: 250px 250px;
        animation: drift-up 70s linear infinite;
        opacity: 0.4;
    }

    /* Far away, slow-moving, dense field */
    .layer-3 {
        background-image: radial-gradient(1px 1px at 50px 160px, #ff9900, transparent),
                          radial-gradient(1px 1px at 90px 40px, #ff3300, transparent),
                          radial-gradient(1px 1px at 130px 180px, #ff7700, transparent),
                          radial-gradient(1px 1px at 200px 110px, #ffaa00, transparent);
        background-size: 200px 200px;
        animation: drift-up 120s linear infinite;
        opacity: 0.2;
    }

    /* Animations */
    @keyframes drift-up {
        0% { transform: translateY(0); }
        100% { transform: translateY(-50%); }
    }

    @keyframes pulse-glow {
        0% { opacity: 0.7; filter: blur(8px); }
        100% { opacity: 1; filter: blur(12px); }
    }
</style>

{{ end }}
